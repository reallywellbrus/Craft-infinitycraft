<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Craft Modes — жалобы</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚩</text></svg>">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-logo" aria-hidden="true">∞</span>
      <span class="brand-text">
        <h1>Craft Modes <span class="mode-label">админ</span></h1>
        <p>жалобы на режимы</p>
      </span>
    </a>
    <span class="spacer"></span>
    <a class="btn" href="index.html">← На сайт</a>
    <button class="btn" id="logoutBtn" type="button" hidden>Выйти</button>
  </header>

  <main class="admin-layout">
    <section class="admin-card" id="loginPanel">
      <h2>Вход администратора</h2>
      <p class="hint">
        Войдите аккаунтом, созданным в Supabase → Authentication → Users.
        Пароль нигде в коде не хранится.
      </p>
      <form class="admin-form" id="loginForm" autocomplete="on">
        <label class="field">
          <span>Email</span>
          <input id="adminEmail" type="email" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Пароль</span>
          <input id="adminPassword" type="password" autocomplete="current-password" required>
        </label>
        <p class="hint" id="loginHint" role="status"></p>
        <button class="btn btn--primary" type="submit" id="loginBtn">Войти</button>
      </form>
    </section>

    <section class="admin-card" id="reportsPanel" hidden>
      <div class="admin-head">
        <div>
          <h2>Жалобы <span class="panel-count" id="reportsCount">0</span></h2>
          <p class="hint">Новые сверху. Закрытые можно вернуть в работу.</p>
        </div>
        <button class="btn" id="refreshBtn" type="button">↻ Обновить</button>
      </div>
      <div class="report-list" id="reportsList"></div>
      <div class="empty-note" id="reportsEmpty" hidden>Жалоб пока нет.</div>
      <p class="hint" id="reportsHint" role="status"></p>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
